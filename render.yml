services:
  - type: web
    name: thabzo-events
    env: python
    buildCommand: |
      apt-get update && apt-get install -y \
        libjpeg-dev \
        zlib1g-dev \
        libpng-dev \
        libfreetype6-dev \
        libtiff-dev \
        libwebp-dev \
        gcc \
        python3-dev \
      && pip install --upgrade pip setuptools wheel \
      && pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: thabzo-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: thabzoevents@gmail.com
      - key: ADMIN_PASSWORD
        value: admin@123
      - key: ADMIN_PHONE
        value: 0765841224
      - key: WHATSAPP_NUMBER
        value: 2765841224
      - key: BUSINESS_NAME
        value: THABZO EVENTS
      - key: BUSINESS_PHONE
        value: 0765841224
      - key: BUSINESS_LOCATION
        value: Jozini, KwaZulu-Natal
      - key: MAIL_SUPPRESS_SEND
        value: true

databases:
  - name: thabzo-db
    databaseName: thabzo
    user: thabzo_user
